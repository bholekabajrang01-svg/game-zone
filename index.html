<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Zone</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e1b4b);
  color:white;
}

.container{
  width:100%;
  max-width:450px;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin:20px 0;
}

.card{
  background:#1f2937;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2,h3{
  text-align:center;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  background:#374151;
  color:white;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#6366f1;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#374151;
}

.danger{
  background:#dc2626;
}

.hidden{
  display:none;
}

.message{
  text-align:center;
  margin-top:12px;
  min-height:20px;
}

.balance{
  text-align:center;
  background:#111827;
  padding:18px;
  border-radius:15px;
  margin:15px 0;
}

.coins{
  font-size:30px;
  font-weight:bold;
  margin-top:5px;
}

.game{
  text-align:center;
}

.symbols{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:20px 0;
}

.slot{
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111827;
  border-radius:12px;
  font-size:40px;
}

.small{
  font-size:14px;
  color:#cbd5e1;
  text-align:center;
}

.link{
  color:#a5b4fc;
  cursor:pointer;
  text-align:center;
  margin-top:15px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header button{
  width:auto;
  padding:9px 14px;
  margin:0;
}

.user{
  color:#c4b5fd;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🎮 Game Zone</div>

  <!-- LOGIN -->
  <div id="loginPage" class="card">

    <h2>🔐 Login</h2>

    <input id="loginUser" type="text" placeholder="Username">

    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="loginMsg" class="message"></div>

    <div class="link" onclick="showSignup()">
      Don't have an account? Signup
    </div>

  </div>


  <!-- SIGNUP -->
  <div id="signupPage" class="card hidden">

    <h2>📝 Create Account</h2>

    <input id="signupUser" type="text" placeholder="Choose username">

    <input id="signupPass" type="password" placeholder="Choose password">

    <input id="signupPass2" type="password" placeholder="Confirm password">

    <button onclick="signup()">Create Account</button>

    <div id="signupMsg" class="message"></div>

    <div class="link" onclick="showLogin()">
      Already have an account? Login
    </div>

  </div>


  <!-- HOME -->
  <div id="homePage" class="hidden">

    <div class="card">

      <div class="header">
        <div>
          Welcome 👋
          <div class="user" id="usernameDisplay"></div>
        </div>

        <button class="danger" onclick="logout()">Logout</button>
      </div>

      <div class="balance">
        🪙 Virtual Coins
        <div class="coins" id="coinDisplay">1000</div>
      </div>

    </div>


    <!-- DEMO GAME -->
    <div class="card game">

      <h2>🎰 Lucky Demo</h2>

      <p class="small">
        Demo game using virtual coins only.
      </p>

      <div class="symbols">
        <div class="slot" id="s1">❓</div>
        <div class="slot" id="s2">❓</div>
        <div class="slot" id="s3">❓</div>
      </div>

      <button onclick="playGame()">PLAY — 50 COINS</button>

      <div id="gameMsg" class="message"></div>

    </div>


    <div class="card">

      <h3>🎮 Games</h3>

      <button onclick="comingSoon()">🎲 Dice Demo</button>
      <button onclick="comingSoon()">🃏 Card Demo</button>
      <button onclick="comingSoon()">🎯 Lucky Number</button>

    </div>

  </div>

</div>


<script>

let currentUser = localStorage.getItem("currentUser");

function getUsers(){
  return JSON.parse(localStorage.getItem("gameUsers") || "{}");
}

function saveUsers(users){
  localStorage.setItem("gameUsers",JSON.stringify(users));
}


function showSignup(){

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("signupPage").classList.remove("hidden");

  document.getElementById("loginMsg").innerText="";
}


function showLogin(){

  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

  document.getElementById("signupMsg").innerText="";
}


function signup(){

  const username =
    document.getElementById("signupUser").value.trim();

  const password =
    document.getElementById("signupPass").value;

  const password2 =
    document.getElementById("signupPass2").value;

  const msg =
    document.getElementById("signupMsg");


  if(username.length < 3){

    msg.innerText="Username कम से कम 3 characters का होना चाहिए.";
    return;

  }


  if(password.length < 4){

    msg.innerText="Password कम से कम 4 characters का होना चाहिए.";
    return;

  }


  if(password !== password2){

    msg.innerText="Passwords match नहीं कर रहे.";
    return;

  }


  const users = getUsers();


  if(users[username]){

    msg.innerText="यह username पहले से मौजूद है.";
    return;

  }


  users[username] = {

    password:password,

    coins:1000

  };


  saveUsers(users);

  msg.innerText="Account बन गया! Login कर रहे हैं...";


  setTimeout(()=>{

    currentUser=username;

    localStorage.setItem("currentUser",username);

    showHome();

  },700);

}


function login(){

  const username =
    document.getElementById("loginUser").value.trim();

  const password =
    document.getElementById("loginPass").value;

  const msg =
    document.getElementById("loginMsg");


  const users=getUsers();


  if(!users[username]){

    msg.innerText="Username नहीं मिला.";
    return;

  }


  if(users[username].password !== password){

    msg.innerText="Password गलत है.";
    return;

  }


  currentUser=username;

  localStorage.setItem("currentUser",username);

  showHome();

}


function showHome(){

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("homePage").classList.remove("hidden");

  document.getElementById("usernameDisplay").innerText=
    currentUser;

  updateCoins();

}


function updateCoins(){

  const users=getUsers();

  if(!users[currentUser]) return;

  document.getElementById("coinDisplay").innerText=
    users[currentUser].coins;

}


function playGame(){

  const users=getUsers();

  if(!users[currentUser]) return;


  if(users[currentUser].coins < 50){

    document.getElementById("gameMsg").innerText=
      "❌ Coins कम हैं.";

    return;

  }


  users[currentUser].coins -= 50;

  saveUsers(users);

  updateCoins();


  const symbols=[
    "🍒",
    "🍋",
    "🍊",
    "⭐",
    "💎",
    "7️⃣"
  ];


  const a=symbols[Math.floor(Math.random()*symbols.length)];
  const b=symbols[Math.floor(Math.random()*symbols.length)];
  const c=symbols[Math.floor(Math.random()*symbols.length)];


  document.getElementById("s1").innerText=a;
  document.getElementById("s2").innerText=b;
  document.getElementById("s3").innerText=c;


  if(a===b && b===c){

    users[currentUser].coins += 500;

    saveUsers(users);

    updateCoins();

    document.getElementById("gameMsg").innerText=
      "🎉 JACKPOT! +500 virtual coins";

  }

  else if(a===b || b===c || a===c){

    users[currentUser].coins += 100;

    saveUsers(users);

    updateCoins();

    document.getElementById("gameMsg").innerText=
      "✨ Match! +100 virtual coins";

  }

  else{

    document.getElementById("gameMsg").innerText=
      "😄 Try again! 50 virtual coins used.";

  }

}


function logout(){

  localStorage.removeItem("currentUser");

  currentUser=null;

  document.getElementById("homePage").classList.add("hidden");

  showLogin();

}


function comingSoon(){

  alert("यह Demo Game जल्द जोड़ा जाएगा.");

}


/* AUTO LOGIN */

if(currentUser){

  const users=getUsers();

  if(users[currentUser]){

    showHome();

  }else{

    localStorage.removeItem("currentUser");

  }

}

</script>

</body>
</html>
